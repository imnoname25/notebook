<!doctype html>
<html lang="ru">
<head>
  <title>Пример публикации | Пикабу</title>
  <meta property="og:title" content="Пример публикации">
</head>
<body>
  <main>
    <article class="story">
      <div class="story__user">
        <a class="story__user-link" href="/@author">
          <div class="avatar avatar_small"><span class="avatar__inner"><img data-src="/author.webp"></span></div>
        </a>
        <a class="story__community-link" href="/community">
          <div class="community-avatar"><span class="avatar__inner"><img src="/community.webp"></span></div>
        </a>
      </div>
      <h1>Пример публикации</h1>
      <div class="story__content story__typography">
        <div class="story__content-inner">
          <div class="story-block story-block_type_text">
            <p>Первый абзац открывает рассказ о ночном маршруте и описывает путь от дома до старого моста.</p>
          </div>
          <div class="story-block story-block_type_image">
            <figure class="story-image image-lazy">
              <div class="story-image__content">
                <a class="image-link" href="/bridge.webp"><img class="story-image__image" src="/placeholder.webp" data-src="/bridge.webp" alt="Старый мост"></a>
              </div>
              <figcaption>Мост перед рассветом.</figcaption>
            </figure>
          </div>
          <div class="story-block story-block_type_text">
            <p>Текст перед <span><img src="/map.webp" alt="Схема"> и после схемы.</span></p>
          </div>
        </div>
        <div class="sponsored"><p>Объявление.</p><img src="/ad.webp"></div>
        <div class="related-posts"><p>Другой материал.</p><img src="/teaser.webp"></div>
      </div>
    </article>
    <aside><form id="signin-form"><input type="password"></form></aside>
  </main>
</body>
</html>
