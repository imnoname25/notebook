name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/notebook

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Validate Unraid templates
        run: npm run validate:unraid
      - name: Validate Docker packaging
        run: npm run validate:docker

  smoke:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build amd64 smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: notebook:smoke
          platforms: linux/amd64
          build-args: |
            NOTEBOOK_VERSION=smoke
            NOTEBOOK_GIT_SHA=${{ github.sha }}
            NOTEBOOK_CHANNEL=smoke
            OCI_SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=notebook-smoke
          cache-to: type=gha,mode=max,scope=notebook-smoke
      - name: Verify image runtime dependencies and permissions
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --entrypoint sh notebook:smoke -c '
            test "$(id -u)" = 0
            test -f /app/docker/preflight.mjs
            test ! -e /usr/local/lib/notebook/preflight.mjs
            cd /app
            node --input-type=module -e "
              import { createRequire } from \"node:module\";
              const require = createRequire(new URL(\"file:///app/docker/preflight.mjs\"));
              require.resolve(\"pg\");
            "
            ./node_modules/.bin/prisma -v >/dev/null
            test -d /app/node_modules/@prisma/engines
            gosu 99:100 sh -c "test ! -w /app && test ! -w /app/node_modules && test ! -w /app/node_modules/@prisma/engines"
          '
      - name: Test migrations, readiness and restart
        shell: bash
        run: |
          set -Eeuo pipefail
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs notebook-smoke-app || true
              docker logs notebook-smoke-postgres || true
            fi
            docker rm -f notebook-smoke-app notebook-smoke-postgres >/dev/null 2>&1 || true
            docker volume rm notebook-smoke-uploads notebook-smoke-backups notebook-smoke-postgres >/dev/null 2>&1 || true
            docker network rm notebook-smoke >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          docker network create notebook-smoke
          docker volume create notebook-smoke-uploads
          docker volume create notebook-smoke-backups
          docker volume create notebook-smoke-postgres

          docker run -d --name notebook-smoke-postgres \
            --network notebook-smoke \
            --health-cmd="pg_isready -U notebook -d notebook" \
            --health-interval=2s --health-timeout=3s --health-retries=30 \
            -e POSTGRES_DB=notebook \
            -e POSTGRES_USER=notebook \
            -e POSTGRES_PASSWORD=notebook-smoke-password \
            -v notebook-smoke-postgres:/var/lib/postgresql/data \
            postgres:17-alpine

          for attempt in $(seq 1 60); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' notebook-smoke-postgres)" = healthy ] && break
            [ "$attempt" -eq 60 ] && exit 1
            sleep 2
          done

          docker run -d --name notebook-smoke-app \
            --network notebook-smoke \
            --init \
            --cap-drop=ALL \
            --cap-add=CHOWN --cap-add=DAC_OVERRIDE --cap-add=FOWNER --cap-add=SETGID --cap-add=SETUID \
            --security-opt=no-new-privileges:true \
            -p 3100:3000 \
            -e DATABASE_URL='postgresql://notebook:notebook-smoke-password@notebook-smoke-postgres:5432/notebook?schema=public' \
            -e APP_ORIGIN=http://127.0.0.1:3100 \
            -e SETTINGS_ENCRYPTION_KEY=1111111111111111111111111111111111111111111111111111111111111111 \
            -e PUID=99 -e PGID=100 -e UMASK=002 \
            -v notebook-smoke-uploads:/data/uploads \
            -v notebook-smoke-backups:/data/backups \
            notebook:smoke

          for attempt in $(seq 1 90); do
            curl --fail --silent http://127.0.0.1:3100/api/health/ready >/dev/null && break
            [ "$attempt" -eq 90 ] && exit 1
            sleep 2
          done

          docker exec notebook-smoke-app sh -c '
            server_pid=1
            pid_one_uid=$(awk "/^Uid:/{print \$2}" /proc/1/status)
            if [ "$pid_one_uid" = "0" ]; then
              server_pid=""
              for child_pid in $(cat /proc/1/task/1/children); do
                [ -r "/proc/$child_pid/status" ] || continue
                child_uid=$(awk "/^Uid:/{print \$2}" "/proc/$child_pid/status")
                [ "$child_uid" != "0" ] || continue
                server_pid=$child_pid
                break
              done
            fi
            [ -n "$server_pid" ] || { echo "Notebook non-root server process not found" >&2; exit 1; }
            grep -E "^(Uid|Gid):" "/proc/$server_pid/status"
            runtime_uid=$(awk "/^Uid:/{print \$2}" "/proc/$server_pid/status")
            runtime_gid=$(awk "/^Gid:/{print \$2}" "/proc/$server_pid/status")
            [ "$runtime_uid" != "0" ] || { echo "Notebook Node server is running as root" >&2; exit 1; }
            [ "$runtime_uid" = "99" ] || { echo "Unexpected Notebook UID: $runtime_uid" >&2; exit 1; }
            [ "$runtime_gid" = "100" ] || { echo "Unexpected Notebook GID: $runtime_gid" >&2; exit 1; }
          '
          docker exec notebook-smoke-app sh -c \
            'test "$(stat -c %u /data/uploads)" = 99 && test "$(stat -c %g /data/uploads)" = 100 && test "$(stat -c %u /data/backups)" = 99 && test "$(stat -c %g /data/backups)" = 100'
          docker exec --user 99:100 notebook-smoke-app sh -c \
            'test -w /data/uploads && test -w /data/backups && test ! -w /app && test ! -w /app/node_modules'

          docker restart notebook-smoke-app
          for attempt in $(seq 1 90); do
            curl --fail --silent http://127.0.0.1:3100/api/health/ready >/dev/null && break
            [ "$attempt" -eq 90 ] && exit 1
            sleep 2
          done

  publish:
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-
      - name: Build and publish multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NOTEBOOK_VERSION=${{ steps.meta.outputs.version }}
            NOTEBOOK_GIT_SHA=${{ github.sha }}
            NOTEBOOK_CHANNEL=${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'edge' }}
            OCI_SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=notebook-multiarch
          provenance: mode=max
          sbom: true
